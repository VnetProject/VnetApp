          package com.vnet.app

          import android.util.Base64
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.Inet4Address
          import java.net.InetAddress
          import java.net.InetSocketAddress
          import java.net.Socket
          import java.net.URLDecoder

          object XrayConfig {
              private class Link(val user: String, val host: String, val port: Int, val q: Map<String, String>)
              private class Ss(val method: String, val pass: String, val host: String, val port: Int)

              private fun b64(s: String): String {
                  var t = s.trim().replace('-', '+').replace('_', '/')
                  while (t.length % 4 != 0) t += "="
                  return String(Base64.decode(t, Base64.DEFAULT), Charsets.UTF_8)
              }

              private fun dec(s: String): String = try { URLDecoder.decode(s, "UTF-8") } catch (e: Exception) { s }

              private fun parse(l: String): Link {
                  var rest = l.substringAfter("://").substringBefore("#")
                  val query = if (rest.contains("?")) rest.substringAfter("?") else ""
                  rest = rest.substringBefore("?")
                  val user = if (rest.contains("@")) dec(rest.substringBeforeLast("@")) else ""
                  val hp = rest.substringAfterLast("@")
                  val host: String
                  val port: Int
                  if (hp.startsWith("[")) {
                      host = hp.substring(1, hp.indexOf("]"))
                      port = hp.substringAfter("]:", "443").toInt()
                  } else {
                      host = hp.substringBeforeLast(":")
                      port = hp.substringAfterLast(":").toInt()
                  }
                  val q = HashMap<String, String>()
                  for (kv in query.split("&")) {
                      if (kv.isEmpty()) continue
                      q[kv.substringBefore("=")] = dec(kv.substringAfter("=", ""))
                  }
                  return Link(user, host, port, q)
              }

              private fun parseSs(l: String): Ss {
                  val core = l.substringAfter("ss://").substringBefore("#").substringBefore("?")
                  val cred: String
                  val hp: String
                  if (core.contains("@")) {
                      val ui = core.substringBeforeLast("@")
                      cred = if (ui.contains(":")) dec(ui) else b64(ui)
                      hp = core.substringAfterLast("@")
                  } else {
                      val d = b64(core)
                      cred = d.substringBeforeLast("@")
                      hp = d.substringAfterLast("@")
                  }
                  return Ss(cred.substringBefore(":"), cred.substringAfter(":"), hp.substringBeforeLast(":"), hp.substringAfterLast(":").toInt())
              }

              fun endpoint(l: String): Pair<String, Int> {
                  if (l.startsWith("vmess://", true)) {
                      val j = JSONObject(b64(l.substring(8)))
                      return Pair(j.getString("add"), j.get("port").toString().toInt())
                  }
                  if (l.startsWith("ss://", true)) {
                      val s = parseSs(l)
                      return Pair(s.host, s.port)
                  }
                  val p = parse(l)
                  return Pair(p.host, p.port)
              }

              private fun resolve(h: String): String {
                  if (h.matches(Regex("^[0-9.]+$")) || h.contains(":")) return h
                  return try {
                      val all = InetAddress.getAllByName(h)
                      val pick = all.firstOrNull { it is Inet4Address } ?: all[0]
                      pick.hostAddress ?: h
                  } catch (e: Exception) {
                      h
                  }
              }

              fun pickBest(links: List<String>): String {
                  if (links.size <= 1) return links[0]
                  val times = LongArray(links.size) { Long.MAX_VALUE }
                  val ts = ArrayList<Thread>()
                  for (i in links.indices) {
                      val th = Thread {
                          try {
                              val ep = endpoint(links[i])
                              val s = Socket()
                              val t0 = System.nanoTime()
                              s.connect(InetSocketAddress(ep.first, ep.second), 3000)
                              times[i] = (System.nanoTime() - t0) / 1000000
                              s.close()
                          } catch (e: Exception) {
                          }
                      }
                      ts.add(th)
                      th.start()
                  }
                  for (th in ts) th.join(3500)
                  var bi = 0
                  for (i in links.indices) if (times[i] < times[bi]) bi = i
                  return links[bi]
              }

              private fun nz(s: String?): String? = if (s.isNullOrEmpty()) null else s

              private fun stream(net0: String, sec: String, p: Map<String, String>, domain: String): JSONObject {
                  val net = when (net0) {
                      "", "tcp" -> "tcp"
                      "h2", "http" -> "h2"
                      "splithttp", "xhttp" -> "xhttp"
                      else -> net0
                  }
                  val s = JSONObject()
                  s.put("network", net)
                  s.put("security", sec)
                  val host = nz(p["host"]) ?: ""
                  val path = nz(p["path"]) ?: "/"
                  val hostOrDomain = if (host.isNotEmpty()) host else domain
                  when (net) {
                      "ws" -> s.put("wsSettings", JSONObject().put("path", path).put("headers", JSONObject().put("Host", hostOrDomain)))
                      "grpc" -> s.put("grpcSettings", JSONObject().put("serviceName", nz(p["serviceName"]) ?: (nz(p["path"]) ?: "")).put("multiMode", p["mode"] == "multi"))
                      "h2" -> s.put("httpSettings", JSONObject().put("path", path).put("host", JSONArray().put(hostOrDomain)))
                      "httpupgrade" -> s.put("httpupgradeSettings", JSONObject().put("path", path).put("host", hostOrDomain))
                      "xhttp" -> s.put("xhttpSettings", JSONObject().put("path", path).put("host", host).put("mode", nz(p["mode"]) ?: "auto"))
                      "tcp" -> if (p["headerType"] == "http") {
                          val req = JSONObject().put("path", JSONArray().put(path)).put("headers", JSONObject().put("Host", JSONArray().put(hostOrDomain)))
                          s.put("tcpSettings", JSONObject().put("header", JSONObject().put("type", "http").put("request", req)))
                      }
                  }
                  val sni = nz(p["sni"]) ?: hostOrDomain
                  if (sec == "tls") {
                      val t = JSONObject()
                      t.put("serverName", sni)
                      val fp = nz(p["fp"])
                      if (fp != null) t.put("fingerprint", fp)
                      val alpn = nz(p["alpn"])
                      if (alpn != null) {
                          val a = JSONArray()
                          for (x in alpn.split(",")) if (x.isNotEmpty()) a.put(x)
                          t.put("alpn", a)
                      }
                      val ins = p["allowInsecure"] ?: p["insecure"]
                      if (ins == "1" || ins == "true") t.put("allowInsecure", true)
                      s.put("tlsSettings", t)
                  } else if (sec == "reality") {
                      val t = JSONObject()
                      t.put("serverName", sni)
                      t.put("fingerprint", nz(p["fp"]) ?: "chrome")
                      t.put("publicKey", p["pbk"] ?: "")
                      t.put("shortId", p["sid"] ?: "")
                      t.put("spiderX", p["spx"] ?: "")
                      s.put("realitySettings", t)
                  }
                  return s
              }

              private fun outbound(l: String): JSONObject {
                  val o = JSONObject()
                  o.put("tag", "proxy")
                  if (l.startsWith("vmess://", true)) {
                      val j = JSONObject(b64(l.substring(8)))
                      val q = HashMap<String, String>()
                      q["host"] = j.optString("host")
                      q["path"] = j.optString("path")
                      q["serviceName"] = j.optString("path")
                      q["sni"] = j.optString("sni")
                      q["alpn"] = j.optString("alpn")
                      q["fp"] = j.optString("fp")
                      q["headerType"] = j.optString("type")
                      val dom = j.getString("add")
                      val sec = if (j.optString("tls") == "tls") "tls" else "none"
                      val user = JSONObject().put("id", j.getString("id")).put("alterId", j.optString("aid", "0").toIntOrNull() ?: 0).put("security", j.optString("scy", "auto").ifEmpty { "auto" })
                      val vn = JSONObject().put("address", resolve(dom)).put("port", j.get("port").toString().toInt()).put("users", JSONArray().put(user))
                      o.put("protocol", "vmess").put("settings", JSONObject().put("vnext", JSONArray().put(vn)))
                      o.put("streamSettings", stream(j.optString("net", "tcp"), sec, q, dom))
                  } else if (l.startsWith("vless://", true)) {
                      val p = parse(l)
                      val sec = p.q["security"] ?: "none"
                      val user = JSONObject().put("id", p.user).put("encryption", nz(p.q["encryption"]) ?: "none")
                      val flow = nz(p.q["flow"])
                      if (flow != null) user.put("flow", flow)
                      val vn = JSONObject().put("address", resolve(p.host)).put("port", p.port).put("users", JSONArray().put(user))
                      o.put("protocol", "vless").put("settings", JSONObject().put("vnext", JSONArray().put(vn)))
                      o.put("streamSettings", stream(p.q["type"] ?: "tcp", sec, p.q, p.host))
                  } else if (l.startsWith("trojan://", true)) {
                      val p = parse(l)
                      val sec = p.q["security"] ?: "tls"
                      val sv = JSONObject().put("address", resolve(p.host)).put("port", p.port).put("password", p.user)
                      o.put("protocol", "trojan").put("settings", JSONObject().put("servers", JSONArray().put(sv)))
                      o.put("streamSettings", stream(p.q["type"] ?: "tcp", sec, p.q, p.host))
                  } else if (l.startsWith("ss://", true)) {
                      val s = parseSs(l)
                      val sv = JSONObject().put("address", resolve(s.host)).put("port", s.port).put("method", s.method).put("password", s.pass)
                      o.put("protocol", "shadowsocks").put("settings", JSONObject().put("servers", JSONArray().put(sv)))
                      o.put("streamSettings", JSONObject().put("network", "tcp"))
                  } else {
                      throw IllegalArgumentException("نوع کانفیگ پشتیبانی نمی‌شود")
                  }
                  return o
              }

              fun build(link: String, port: Int = 10808): String {
                  val root = JSONObject()
                  root.put("log", JSONObject().put("loglevel", "warning"))
                  root.put("dns", JSONObject().put("servers", JSONArray().put("1.1.1.1").put("8.8.8.8")))
                  val inb = JSONObject()
                  inb.put("tag", "socks").put("listen", "127.0.0.1").put("port", port).put("protocol", "socks")
                  inb.put("settings", JSONObject().put("auth", "noauth").put("udp", true))
                  inb.put("sniffing", JSONObject().put("enabled", true).put("destOverride", JSONArray().put("http").put("tls").put("quic")))
                  root.put("inbounds", JSONArray().put(inb))
                  val outs = JSONArray()
                  outs.put(outbound(link))
                  outs.put(JSONObject().put("tag", "direct").put("protocol", "freedom"))
                  outs.put(JSONObject().put("tag", "block").put("protocol", "blackhole"))
                  root.put("outbounds", outs)
                  return root.toString()
              }
          }
          VNET_EOF
          mkdir -p android/app/src/main/java/com/vnet/app
          cat > android/app/src/main/java/com/vnet/app/Report.kt <<'VNET_EOF'
          package com.vnet.app

          import android.app.ActivityManager
          import android.content.Context
          import android.os.Build
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object Report {
              fun install(ctx: Context) {
                  val old = Thread.getDefaultUncaughtExceptionHandler()
                  val dir = ctx.filesDir
                  Thread.setDefaultUncaughtExceptionHandler { t, e ->
                      try {
                          File(dir, "crash.txt").writeText(SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(Date()) + "\nthread=" + t.name + "\n" + android.util.Log.getStackTraceString(e))
                      } catch (x: Exception) {
                      }
                      old?.uncaughtException(t, e)
                  }
              }

              private fun tail(f: File, n: Int): String = try { if (f.exists()) f.readText().takeLast(n) else "" } catch (e: Exception) { "" }

              fun previousDied(ctx: Context): Boolean {
                  val f = File(ctx.filesDir, "running.flag")
                  if (f.exists() && VnetVpnService.state == "off") {
                      f.delete()
                      return true
                  }
                  return false
              }

              fun clear(ctx: Context) {
                  for (n in arrayOf("crash.txt", "xray.log", "hev.log")) File(ctx.filesDir, n).delete()
              }

              fun build(ctx: Context): String {
                  val sb = StringBuilder()
                  sb.append("Android ").append(Build.VERSION.SDK_INT).append(" / ").append(Build.MANUFACTURER).append(" ").append(Build.MODEL).append(" / ").append(Build.SUPPORTED_ABIS.joinToString(",")).append("\n")
                  val crash = File(ctx.filesDir, "crash.txt")
                  if (crash.exists()) sb.append("\n--- crash ---\n").append(tail(crash, 2500))
                  if (Build.VERSION.SDK_INT >= 30) {
                      try {
                          val am = ctx.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                          for (i in am.getHistoricalProcessExitReasons(ctx.packageName, 0, 4)) {
                              sb.append("\n--- exit ---\nreason=").append(i.reason).append(" status=").append(i.status).append(" ").append(i.description ?: "")
                              sb.append(" at ").append(SimpleDateFormat("MM-dd HH:mm:ss", Locale.US).format(Date(i.timestamp)))
                          }
                      } catch (e: Exception) {
                      }
                  }
                  val x = tail(File(ctx.filesDir, "xray.log"), 1500)
                  if (x.isNotEmpty()) sb.append("\n--- xray ---\n").append(x)
                  val h = tail(File(ctx.filesDir, "hev.log"), 1200)
                  if (h.isNotEmpty()) sb.append("\n--- tunnel ---\n").append(h)
                  return sb.toString()
              }
          }
          VNET_EOF
      - name: Signing key
        run: |
          if [ ${#SIGN_PASS} -lt 6 ]; then echo "رمز امضا باید حداقل ۶ کاراکتر باشد"; exit 1; fi
          if [ ! -f signing.p12 ]; then
            keytool -genkeypair -storetype PKCS12 -keystore signing.p12 -storepass "$SIGN_PASS" -keypass "$SIGN_PASS" -alias vnet -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=VNet"
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add signing.p12
            git commit -m "add signing key"
            git push
          fi
          cp signing.p12 android/signing.p12
      - name: Get Xray core and tunnel library
        run: |
          set -x
          JNI=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNI"
          curl -fL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-android-arm64-v8a.zip
          unzip -o xray.zip xray -d xraydir
          cp xraydir/xray "$JNI/libxray.so"
          chmod +x "$JNI/libxray.so"
          NDK="${ANDROID_NDK_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | tail -1)}"
          OK=0
          if git clone --recursive https://github.com/heiher/hev-socks5-tunnel hev; then
            ( cd hev
              mkdir -p jni
              echo 'include $(call all-subdir-makefiles)' > jni/Android.mk
              ln -sf "$PWD" jni/hev-socks5-tunnel
              "$NDK/ndk-build" NDK_PROJECT_PATH="$PWD" APP_ABI=arm64-v8a APP_PLATFORM=android-24 "APP_CFLAGS=-O3 -DPKGNAME=hev/htproxy -DCLSNAME=TProxyService" "APP_LDFLAGS=-Wl,--build-id=none -Wl,--hash-style=gnu" NDK_LIBS_OUT="$PWD/out/libs" NDK_OUT="$PWD/out/obj"
            ) && [ -f hev/out/libs/arm64-v8a/libhev-socks5-tunnel.so ] && cp hev/out/libs/arm64-v8a/libhev-socks5-tunnel.so "$JNI/" && OK=1
          fi
          if [ "$OK" != 1 ]; then
            echo "building hev failed, falling back to v2rayNG prebuilt"
            URL=$(curl -s https://api.github.com/repos/2dust/v2rayNG/releases/latest | python3 -c "import sys,json; r=json.load(sys.stdin); print([a['browser_download_url'] for a in r['assets'] if 'arm64-v8a' in a['name'] and a['name'].endswith('.apk')][0])")
            curl -fL -o v2.apk "$URL"
            unzip -o v2.apk 'lib/arm64-v8a/libhev-socks5-tunnel.so' -d v2
            cp v2/lib/arm64-v8a/libhev-socks5-tunnel.so "$JNI/"
          fi
          test -f "$JNI/libhev-socks5-tunnel.so"
          SO="$JNI/libhev-socks5-tunnel.so"
          CLS=$(strings -a "$SO" | grep -E '^[A-Za-z0-9_]+(/[A-Za-z0-9_]+)*/TProxyService$' | head -1 || true)
          if [ -z "$CLS" ]; then
            SYM=$(nm -D "$SO" | grep -o 'Java_[A-Za-z0-9_]*_TProxyStartService' | head -1 || true)
            if [ -n "$SYM" ]; then CLS=$(echo "$SYM" | sed -e 's/^Java_//' -e 's/_TProxyStartService$//' -e 's/_/\//g'); fi
          fi
          if [ -z "$CLS" ]; then CLS="hev/htproxy/TProxyService"; fi
          echo "JNI class: $CLS"
          PKG=$(dirname "$CLS" | tr '/' '.')
          DIR="android/app/src/main/java/$(dirname "$CLS")"
          mkdir -p "$DIR"
          cat > "$DIR/TProxyService.kt" <<EOF2
          package $PKG
          object TProxyService {
              init { System.loadLibrary("hev-socks5-tunnel") }
              @JvmStatic external fun TProxyStartService(configPath: String, fd: Int)
              @JvmStatic external fun TProxyStopService()
          }
          EOF2
          cat > android/app/src/main/java/com/vnet/app/TunBridge.kt <<EOF2
          package com.vnet.app
          import $PKG.TProxyService
          object TunBridge {
              fun start(cfg: String, fd: Int) { TProxyService.TProxyStartService(cfg, fd) }
              fun stop() { TProxyService.TProxyStopService() }
          }
          EOF2

      - name: Build
        working-directory: android
        run: |
          SITE="${SITE_URL%/}"
          SITE="${SITE%/index.php}"
          SITE="${SITE%/api}"
          SITE="${SITE%/app}"
          echo "API base: $SITE/api/index.php"
          gradle assembleRelease "-PAPI_URL=$SITE/api/index.php?r=" "-PNATIVE_KEY=$NATIVE_KEY" "-PAPP_NAME=$APP_NAME" "-PVERSION_CODE=${{ github.run_number }}" --no-daemon --stacktrace
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk vnet.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ${{ inputs.app_name }} ${{ github.run_number }}
          files: vnet.apk
