          fun islandOpen(host: FrameLayout, page: View, ox: Float, oy: Float) {
              val ctx = host.context
              host.addView(page, FrameLayout.LayoutParams(MATCH, MATCH))
              page.visibility = View.INVISIBLE
              host.post {
                  val maxR = ctx.dp(38).toFloat()
                  var rad = maxR
                  page.pivotX = ox
                  page.pivotY = oy
                  page.clipToOutline = true
                  page.outlineProvider = object : ViewOutlineProvider() {
                      override fun getOutline(v: View, o: Outline) {
                          o.setRoundRect(0, 0, v.width, v.height, rad)
                      }
                  }
                  page.visibility = View.VISIBLE
                  val ov = OvershootInterpolator(0.9f)
                  val a = ValueAnimator.ofFloat(0f, 1f)
                  a.duration = 540
                  a.addUpdateListener {
                      val f = it.animatedValue as Float
                      val e = ov.getInterpolation(f)
                      page.scaleX = 0.14f + 0.86f * e
                      page.scaleY = 0.04f + 0.96f * e
                      page.alpha = minOf(1f, f * 2.4f)
                      rad = maxR * (1f - f)
                      page.invalidateOutline()
                  }
                  a.addListener(object : AnimatorListenerAdapter() {
                      override fun onAnimationEnd(an: Animator) {
                          page.scaleX = 1f
                          page.scaleY = 1f
                          page.alpha = 1f
                          page.clipToOutline = false
                      }
                  })
                  a.start()
              }
          }

          fun islandClose(host: FrameLayout, page: View, ox: Float, oy: Float) {
              val ctx = host.context
              val maxR = ctx.dp(38).toFloat()
              var rad = 0f
              page.pivotX = ox
              page.pivotY = oy
              page.clipToOutline = true
              page.outlineProvider = object : ViewOutlineProvider() {
                  override fun getOutline(v: View, o: Outline) {
                      o.setRoundRect(0, 0, v.width, v.height, rad)
                  }
              }
              val ac = AccelerateInterpolator(1.4f)
              val a = ValueAnimator.ofFloat(0f, 1f)
              a.duration = 300
              a.addUpdateListener {
                  val f = ac.getInterpolation(it.animatedValue as Float)
                  page.scaleX = 1f - 0.86f * f
                  page.scaleY = 1f - 0.96f * f
                  page.alpha = 1f - f
                  rad = maxR * f
                  page.invalidateOutline()
              }
              a.addListener(object : AnimatorListenerAdapter() {
                  override fun onAnimationEnd(an: Animator) {
                      host.removeView(page)
                  }
              })
              a.start()
          }

