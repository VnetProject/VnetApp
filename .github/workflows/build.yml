name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'آدرس صفحه اپ، مثلا https://example.com/app/'
        required: true
      native_key:
        description: 'کلید اپ (از پنل مدیریت، بخش تنظیمات)'
        required: true
      app_name:
        description: 'نام برنامه'
        default: 'VNet'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ inputs.app_url }}
      NATIVE_KEY: ${{ inputs.native_key }}
      APP_NAME: ${{ inputs.app_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Accept licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Generate project
        run: |
          mkdir -p android
          cat > android/settings.gradle.kts <<'VNET_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "vnetapp"
          include(":app")
          VNET_EOF
          mkdir -p android
          cat > android/build.gradle.kts <<'VNET_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          VNET_EOF
          mkdir -p android
          cat > android/gradle.properties <<'VNET_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          kotlin.code.style=official
          VNET_EOF
          mkdir -p android/app
          cat > android/app/build.gradle.kts <<'VNET_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.vnet.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.vnet.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  buildConfigField("String", "APP_URL", "\"" + (project.findProperty("APP_URL") ?: "https://example.com/app/") + "\"")
                  buildConfigField("String", "NATIVE_KEY", "\"" + (project.findProperty("NATIVE_KEY") ?: "") + "\"")
                  resValue("string", "app_name", (project.findProperty("APP_NAME") ?: "VNet").toString())
              }
              buildFeatures { buildConfig = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          VNET_EOF
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml <<'VNET_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          VNET_EOF
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_launcher.xml <<'VNET_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0A0A0A" android:pathData="M0,0h108v108h-108z" />
              <path android:strokeColor="#5C8FD6" android:strokeWidth="6" android:strokeLineCap="round" android:fillColor="#00000000"
                  android:pathData="M54,28 L54,54 M37,40 A24,24 0 1 0 71,40" />
          </vector>
          VNET_EOF
          mkdir -p android/app/src/main/java/com/vnet/app
          cat > android/app/src/main/java/com/vnet/app/MainActivity.kt <<'VNET_EOF'
          package com.vnet.app

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.WindowManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class MainActivity : Activity() {
              private lateinit var web: WebView
              private var session: String = ""

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE)
                  window.statusBarColor = Color.parseColor("#080808")
                  window.navigationBarColor = Color.parseColor("#080808")
                  web = WebView(this)
                  web.setBackgroundColor(Color.parseColor("#080808"))
                  setContentView(web)
                  WebView.setWebContentsDebuggingEnabled(false)
                  val s = web.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.allowFileAccess = false
                  s.allowContentAccess = false
                  web.addJavascriptInterface(Bridge(), "Android")
                  val host = Uri.parse(BuildConfig.APP_URL).host
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          if (request.url.host == host) return false
                          try { startActivity(Intent(Intent.ACTION_VIEW, request.url)) } catch (e: Exception) { }
                          return true
                      }
                  }
                  web.loadUrl(BuildConfig.APP_URL)
              }

              inner class Bridge {
                  @JavascriptInterface
                  fun openUrl(u: String) {
                      try { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(u))) } catch (e: Exception) { }
                  }

                  @JavascriptInterface
                  fun setSession(t: String) { session = t }

                  @JavascriptInterface
                  fun coreReady(): Boolean = false

                  @JavascriptInterface
                  fun connect(serviceId: String, configId: String) { }

                  @JavascriptInterface
                  fun disconnect() { }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }
          }
          VNET_EOF
      - name: Build
        working-directory: android
        run: gradle assembleDebug -PAPP_URL="$APP_URL" -PNATIVE_KEY="$NATIVE_KEY" -PAPP_NAME="$APP_NAME" --no-daemon --stacktrace
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk vnet.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ${{ inputs.app_name }} ${{ github.run_number }}
          files: vnet.apk
