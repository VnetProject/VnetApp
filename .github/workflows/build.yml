name: Build APK
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'آدرس سایت (پوشه‌ی نصب)، مثلا https://example.com/app'
        required: true
      native_key:
        description: 'کلید اپ (از پنل مدیریت، بخش تنظیمات)'
        required: true
      sign_password:
        description: 'رمز امضا (یک رمز دلخواه حداقل ۶ حرف؛ همیشه همان را بزن)'
        required: true
      app_name:
        description: 'نام برنامه'
        default: 'VNet'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ inputs.site_url }}
      NATIVE_KEY: ${{ inputs.native_key }}
      APP_NAME: ${{ inputs.app_name }}
      SIGN_PASS: ${{ inputs.sign_password }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Accept licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Generate project
        run: |
          mkdir -p android
          cat > android/settings.gradle.kts <<'VNET_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "vnetapp"
          include(":app")
          VNET_EOF
          mkdir -p android
          cat > android/build.gradle.kts <<'VNET_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          VNET_EOF
          mkdir -p android
          cat > android/gradle.properties <<'VNET_EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          kotlin.code.style=official
          VNET_EOF
          mkdir -p android/app
          cat > android/app/build.gradle.kts <<'VNET_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.vnet.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.vnet.app"
                  minSdk = 24
                  targetSdk = 33
                  versionCode = (project.findProperty("VERSION_CODE") as String?)?.toIntOrNull() ?: 1
                  versionName = "1.0"
                  buildConfigField("String", "API_URL", "\"" + (project.findProperty("API_URL") ?: "https://example.com/api/index.php?r=") + "\"")
                  buildConfigField("String", "NATIVE_KEY", "\"" + (project.findProperty("NATIVE_KEY") ?: "") + "\"")
                  resValue("string", "app_name", (project.findProperty("APP_NAME") ?: "VNet").toString())
                  ndk { abiFilters += listOf("arm64-v8a") }
              }
              signingConfigs {
                  create("rel") {
                      storeFile = file("../signing.p12")
                      storePassword = System.getenv("SIGN_PASS")
                      keyAlias = "vnet"
                      keyPassword = System.getenv("SIGN_PASS")
                      storeType = "pkcs12"
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("rel")
                      isMinifyEnabled = false
                  }
              }
              buildFeatures { buildConfig = true }
              packaging { jniLibs { useLegacyPackaging = true } }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          VNET_EOF
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml <<'VNET_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:extractNativeLibs="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".VnetVpnService"
                      android:exported="false"
                      android:permission="android.permission.BIND_VPN_SERVICE">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          VNET_EOF
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_launcher.xml <<'VNET_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0A0A0A" android:pathData="M0,0h108v108h-108z" />
              <path android:strokeColor="#5C8FD6" android:strokeWidth="6" android:strokeLineCap="round" android:fillColor="#00000000"
                  android:pathData="M54,28 L54,54 M37,40 A24,24 0 1 0 71,40" />
          </vector>
          VNET_EOF
          mkdir -p android/app/src/main/java/com/vnet/app
          cat > android/app/src/main/java/com/vnet/app/MainActivity.kt <<'VNET_EOF'
          package com.vnet.app

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.net.VpnService
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.text.NumberFormat
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : Activity() {
              private lateinit var host: FrameLayout
              private lateinit var prefs: android.content.SharedPreferences
              private val ui = Handler(Looper.getMainLooper())

              private var tabBody: FrameLayout? = null
              private val navIcons = ArrayList<IconView>()
              private val navLabels = ArrayList<TextView>()
              private val pages = ArrayList<Triple<View, Float, Float>>()

              private var services = ArrayList<JSONObject>()
              private var sel = 0
              private var cur: JSONObject? = null
              private var cfgs = ArrayList<Pair<String, String>>()
              private var pick = "auto"
              private var ann = ""
              private var power: PowerView? = null
              private var status: TextView? = null
              private var panelsJson: JSONArray = JSONArray()
              private var lastVpn = "off"

              private fun fa(n: Long): String = NumberFormat.getInstance(Locale("fa")).format(n)
              private fun bytes(b: Long): String {
                  val u = arrayOf("B", "KB", "MB", "GB", "TB")
                  var v = b.toDouble()
                  var i = 0
                  while (v >= 1024 && i < 4) { v /= 1024; i++ }
                  return NumberFormat.getInstance(Locale("fa")).format(Math.round(v * 100) / 100.0) + " " + u[i]
              }
              private fun left(sec: Long): String {
                  if (sec < 0) return "نامحدود"
                  val d = sec / 86400
                  if (d > 0) return fa(d) + " روز"
                  val h = sec / 3600
                  return if (h > 0) fa(h) + " ساعت" else fa(sec / 60) + " دقیقه"
              }
              private fun date(ts: Long): String = SimpleDateFormat("yyyy/MM/dd HH:mm", Locale.US).format(Date(ts * 1000))
              private fun toast(m: String) { Toast.makeText(this, m, Toast.LENGTH_LONG).show() }
              private fun openUrl(u: String) { try { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(u))) } catch (e: Exception) { toast("باز کردن لینک ممکن نشد") } }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE)
                  window.statusBarColor = Theme.bg
                  window.navigationBarColor = Theme.bg
                  Report.install(this)
                  prefs = getSharedPreferences("v", 0)
                  Api.token = prefs.getString("tok", "") ?: ""
                  host = FrameLayout(this)
                  host.setBackgroundColor(Theme.bg)
                  host.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  setContentView(host)
                  VnetVpnService.listener = { runOnUiThread { onVpn() } }
                  if (Build.VERSION.SDK_INT >= 33) requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1)
                  if (Api.token.isEmpty()) showLogin() else showMain(false)
                  ui.postDelayed({ showPrevious() }, 700)
              }

              private fun copyText(t: String) {
                  val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  cm.setPrimaryClip(ClipData.newPlainText("report", t))
                  toast("کپی شد")
              }

              private fun showPrevious() {
                  if (!Report.previousDied(this)) return
                  val txt = Report.build(this)
                  dlg().setTitle("اتصال قبلی ناگهان قطع شد").setMessage(txt.takeLast(1800))
                      .setPositiveButton("کپی گزارش") { _, _ -> copyText(txt) }
                      .setNegativeButton("بستن", null).show()
              }

              override fun onDestroy() {
                  VnetVpnService.listener = null
                  super.onDestroy()
              }

              private fun fail(e: ApiError) {
                  if (e.code == "unauthorized") logout() else toast(e.message ?: "خطا")
              }

              private fun confirmLogout() {
                  dlg().setMessage("از حساب کاربری خارج می‌شوید؟")
                      .setPositiveButton("خروج") { _, _ -> logout() }
                      .setNegativeButton("انصراف", null).show()
              }

              private fun logout() {
                  if (Api.token.isNotEmpty()) Api.call("logout", JSONObject(), false, { }, { })
                  prefs.edit().remove("tok").apply()
                  Api.token = ""
                  if (VnetVpnService.state != "off") startService(Intent(this, VnetVpnService::class.java).setAction("stop"))
                  services.clear(); cur = null; pages.clear(); cfgs.clear(); pick = "auto"; sel = 0
                  host.removeAllViews()
                  showLogin()
              }

              /* ---------------- ورود ---------------- */
              private fun showLogin() {
                  host.removeAllViews()
                  val col = column(24)
                  col.gravity = Gravity.CENTER_VERTICAL
                  val sv = ScrollView(this)
                  sv.isFillViewport = true
                  sv.addView(col)
                  host.addView(glassRoot(sv), FrameLayout.LayoutParams(MATCH, MATCH))
                  col.add(text(getString(R.string.app_name), 32f, Theme.text, true), WRAP, WRAP, 0)
                  col.add(text("برای ادامه وارد شوید", 14f, Theme.muted), WRAP, WRAP, 6)
                  val c = card()
                  col.add(c, MATCH, WRAP, 28)
                  emailStep(c)
                  col.add(button("ورود با تلگرام", "ghost") { tgLogin() }, MATCH, WRAP, 12)
                  sv.alpha = 0f
                  sv.translationY = dp(16).toFloat()
                  sv.animate().alpha(1f).translationY(0f).setDuration(380).start()
              }

              private fun emailStep(c: LinearLayout) {
                  c.removeAllViews()
                  val em = input("ایمیل", InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_EMAIL_ADDRESS)
                  c.addView(em)
                  c.add(button("ارسال کد") {
                      val e = em.text.toString().trim()
                      Api.call("auth/email_send", JSONObject().put("email", e), false, { codeStep(c, e) }, { x -> toast(x.message ?: "خطا") })
                  }, MATCH, WRAP, 12)
              }

              private fun codeStep(c: LinearLayout, email: String) {
                  c.removeAllViews()
                  c.addView(text("کد ارسال‌شده به $email", 13f, Theme.muted))
                  val cd = input("کد ۶ رقمی", InputType.TYPE_CLASS_NUMBER)
                  c.add(cd, MATCH, WRAP, 10)
                  c.add(button("ورود") {
                      Api.call("auth/email_verify", JSONObject().put("email", email).put("code", cd.text.toString()), false, { r -> loggedIn(r.getString("token")) }, { x -> toast(x.message ?: "خطا") })
                  }, MATCH, WRAP, 12)
                  c.add(button("تغییر ایمیل", "ghost") { emailStep(c) }, MATCH, WRAP, 6)
              }

              private fun loggedIn(t: String) {
                  Api.token = t
                  prefs.edit().putString("tok", t).apply()
                  showMain(true)
              }

              private fun tgLogin() {
                  Api.call("auth/tg_start", JSONObject(), false, { r ->
                      openUrl(r.getString("link"))
                      toast("بعد از تأیید در ربات، به برنامه برگردید")
                      pollTg(r.getString("token"), 0, false)
                  }, { x -> toast(x.message ?: "خطا") })
              }

              private fun pollTg(token: String, n: Int, link: Boolean) {
                  if (isFinishing || n > 150) return
                  ui.postDelayed({
                      Api.call("auth/tg_poll", JSONObject().put("token", token), false, { r ->
                          val st = r.optString("status")
                          if (st == "ok" && !link) loggedIn(r.getString("token"))
                          else if (st == "linked") { toast("تلگرام وصل شد ✓"); selectTab(2) }
                          else pollTg(token, n + 1, link)
                      }, { x -> if (x.code == "net") pollTg(token, n + 1, link) else toast(x.message ?: "خطا") })
                  }, 2000)
              }

              /* ---------------- صفحه‌ی اصلی ---------------- */
              private fun showMain(animate: Boolean) {
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  val body = FrameLayout(this)
                  tabBody = body
                  root.addView(body, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  val nlp = LinearLayout.LayoutParams(MATCH, WRAP)
                  nlp.setMargins(dp(16), dp(4), dp(16), dp(12))
                  root.addView(buildNav(), nlp)
                  val wrap = glassRoot(root, 1.3f)
                  if (animate) {
                      val old = ArrayList<View>()
                      for (i in 0 until host.childCount) old.add(host.getChildAt(i))
                      islandOpen(host, wrap, host.width / 2f, dp(20).toFloat())
                      ui.postDelayed({ for (v in old) host.removeView(v) }, 700)
                  } else {
                      host.removeAllViews()
                      host.addView(wrap, FrameLayout.LayoutParams(MATCH, MATCH))
                  }
                  selectTab(0)
              }

              private fun buildNav(): View {
                  val bar = LinearLayout(this)
                  bar.orientation = LinearLayout.HORIZONTAL
                  bar.background = glass(this, 28, 0x30, 0x12, 0x45)
                  bar.setPadding(dp(8), dp(4), dp(8), dp(4))
                  navIcons.clear(); navLabels.clear()
                  val names = arrayOf("اتصالات", "اشتراک", "حساب کاربری")
                  for (i in 0..2) {
                      val item = LinearLayout(this)
                      item.orientation = LinearLayout.VERTICAL
                      item.gravity = Gravity.CENTER
                      item.setPadding(0, dp(6), 0, dp(6))
                      val ic = IconView(this, i)
                      val lb = text(names[i], 11f, Theme.muted)
                      item.addView(ic, LinearLayout.LayoutParams(dp(24), dp(24)))
                      item.addView(lb, LinearLayout.LayoutParams(WRAP, WRAP))
                      item.setOnClickListener { selectTab(i) }
                      bar.addView(item, LinearLayout.LayoutParams(0, WRAP, 1f))
                      navIcons.add(ic); navLabels.add(lb)
                  }
                  return bar
              }

              private fun selectTab(i: Int) {
                  for (k in 0..2) {
                      val c = if (k == i) Theme.primary else Theme.muted
                      navIcons[k].color = c
                      navLabels[k].setTextColor(c)
                  }
                  val body = tabBody ?: return
                  body.removeAllViews()
                  val v = if (i == 0) connTab() else if (i == 1) subTab() else accTab()
                  body.addView(v)
                  v.alpha = 0f
                  v.translationY = dp(14).toFloat()
                  v.animate().alpha(1f).translationY(0f).setDuration(240).start()
              }

              private fun scrollCol(title: String): Pair<ScrollView, LinearLayout> {
                  val col = column(16)
                  val sv = ScrollView(this)
                  sv.isVerticalScrollBarEnabled = false
                  sv.addView(col)
                  col.add(text(title, 22f, Theme.text, true), WRAP, WRAP, 4)
                  return Pair(sv, col)
              }

              private fun retry(body: LinearLayout, e: ApiError, again: () -> Unit) {
                  if (e.code == "unauthorized") { logout(); return }
                  body.removeAllViews()
                  val c = card()
                  c.addView(text(e.message ?: "خطا", 14f, Theme.text))
                  c.add(button("تلاش دوباره", "ghost") { again() }, MATCH, WRAP, 12)
                  body.add(c, MATCH, WRAP, 8)
              }

              /* ---------------- تب اتصالات ---------------- */
              private var connBody: LinearLayout? = null

              private fun connTab(): View {
                  val (sv, col) = scrollCol("اتصالات")
                  val body = column()
                  connBody = body
                  col.add(body, MATCH, WRAP, 8)
                  loadServices(body)
                  return sv
              }

              private fun loadServices(body: LinearLayout) {
                  body.removeAllViews()
                  body.addView(text("در حال بارگذاری…", 14f, Theme.muted))
                  Api.call("services", JSONObject(), false, { r ->
                      ann = r.optString("announcement")
                      services.clear()
                      val a = r.getJSONArray("services")
                      for (i in 0 until a.length()) services.add(a.getJSONObject(i))
                      if (services.isNotEmpty() && services.none { it.getInt("id") == sel }) sel = services[0].getInt("id")
                      if (services.isEmpty()) renderConn(body) else loadConfigs(body)
                  }, { e -> retry(body, e) { loadServices(body) } })
              }

              private fun loadConfigs(body: LinearLayout) {
                  Api.call("configs", JSONObject().put("service_id", sel), false, { r ->
                      cur = r.getJSONObject("service")
                      cfgs.clear()
                      val a = r.getJSONArray("configs")
                      for (i in 0 until a.length()) cfgs.add(Pair(a.getJSONObject(i).getString("id"), a.getJSONObject(i).getString("name")))
                      if (r.has("announcement")) ann = r.optString("announcement")
                      renderConn(body)
                  }, { e -> retry(body, e) { loadServices(body) } })
              }

              private fun stateInt(): Int = if (VnetVpnService.state == "on") 2 else if (VnetVpnService.state == "connecting") 1 else 0

              private fun renderConn(body: LinearLayout) {
                  body.removeAllViews()
                  if (ann.isNotEmpty()) {
                      val c = card()
                      c.addView(text("📢 $ann"))
                      body.add(c, MATCH, WRAP, 0)
                  }
                  if (services.isEmpty()) {
                      val c = card()
                      c.addView(text("هنوز اشتراکی ندارید.", 14f, Theme.muted))
                      c.add(button("خرید یا دریافت تست") { selectTab(1) }, MATCH, WRAP, 14)
                      body.add(c, MATCH, WRAP, 12)
                      return
                  }
                  if (services.size > 1) {
                      val hs = HorizontalScrollView(this)
                      hs.isHorizontalScrollBarEnabled = false
                      val row = LinearLayout(this)
                      for (s in services) {
                          val on = s.getInt("id") == sel
                          val chip = text(s.optString("panel_name") + " · " + s.optString("plan_name").ifEmpty { "سرویس" }, 13f, if (on) Color.WHITE else Theme.text)
                          chip.setPadding(dp(14), dp(8), dp(14), dp(8))
                          chip.background = if (on) primaryBg(this, 20) else glass(this, 20)
                          chip.setOnClickListener { sel = s.getInt("id"); loadServices(body) }
                          val lp = LinearLayout.LayoutParams(WRAP, WRAP)
                          lp.marginEnd = dp(8)
                          row.addView(chip, lp)
                      }
                      hs.addView(row)
                      body.add(hs, MATCH, WRAP, 12)
                  }
                  val pw = PowerView(this)
                  pw.st = stateInt()
                  pw.setOnClickListener { toggleVpn() }
                  power = pw
                  val lp = LinearLayout.LayoutParams(dp(230), dp(230))
                  lp.gravity = Gravity.CENTER_HORIZONTAL
                  lp.topMargin = dp(8)
                  body.addView(pw, lp)
                  val st = text("", 15f, Theme.text, true)
                  st.gravity = Gravity.CENTER
                  status = st
                  body.add(st, MATCH, WRAP, 0)
                  onVpn()

                  val c = cur
                  if (c != null) {
                      val u = card()
                      val ok = c.optString("status").let { it == "active" || it == "unknown" || it == "on_hold" }
                      u.addView(kv("وضعیت", if (ok) "فعال" else c.optString("status"), if (ok) Theme.success else Theme.danger))
                      val rem = c.optLong("remaining", -1)
                      u.addView(kv("حجم باقی‌مانده", if (rem < 0) "نامحدود" else bytes(rem)))
                      val lim = c.optLong("limit", 0)
                      if (lim > 0) u.add(bar((c.optLong("used", 0) * 100 / lim).toInt()), MATCH, WRAP, 2)
                      u.addView(kv("زمان باقی‌مانده", left(c.optLong("seconds_left", -1))))
                      body.add(u, MATCH, WRAP, 16)
                  }
                  val lc = card()
                  val head = LinearLayout(this)
                  head.gravity = Gravity.CENTER_VERTICAL
                  head.addView(text("کانفیگ‌ها", 16f, Theme.text, true), LinearLayout.LayoutParams(0, WRAP, 1f))
                  head.addView(button("بروزرسانی", "ghost") { loadServices(body); toast("در حال بروزرسانی…") }, LinearLayout.LayoutParams(WRAP, WRAP))
                  lc.addView(head)
                  lc.add(cfgRow("auto", "اتصال خودکار", "سریع‌ترین کانفیگ انتخاب می‌شود"), MATCH, WRAP, 8)
                  for (p in cfgs) lc.add(cfgRow(p.first, p.second, ""), MATCH, WRAP, 8)
                  body.add(lc, MATCH, WRAP, 16)
              }

              private fun cfgRow(id: String, name: String, sub: String): View {
                  val on = pick == id || (id == "auto" && cfgs.none { it.first == pick })
                  val r = LinearLayout(this)
                  r.gravity = Gravity.CENTER_VERTICAL
                  r.setPadding(dp(14), dp(12), dp(14), dp(12))
                  r.background = if (on) selBg(this) else glass(this, 14, 0x14, 0x06, 0x28)
                  val dot = View(this)
                  dot.background = shape(if (on) Theme.primary else Color.TRANSPARENT, dp(8).toFloat(), if (on) Theme.primary else Theme.muted, 2)
                  val dl = LinearLayout.LayoutParams(dp(16), dp(16))
                  dl.marginEnd = dp(12)
                  r.addView(dot, dl)
                  val tc = column()
                  tc.addView(text(name, 14f, Theme.text, on))
                  if (sub.isNotEmpty()) tc.addView(text(sub, 12f, Theme.muted))
                  r.addView(tc, LinearLayout.LayoutParams(0, WRAP, 1f))
                  r.setOnClickListener { pick = id; connBody?.let { renderConn(it) } }
                  return r
              }

              private fun toggleVpn() {
                  if (VnetVpnService.state != "off") {
                      startService(Intent(this, VnetVpnService::class.java).setAction("stop"))
                      return
                  }
                  if (cur == null) { toast("ابتدا یک سرویس فعال لازم است"); return }
                  val i = VpnService.prepare(this)
                  if (i != null) startActivityForResult(i, 77) else beginConnect()
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(rc: Int, res: Int, d: Intent?) {
                  if (rc == 77) { if (res == RESULT_OK) beginConnect() else toast("مجوز اتصال داده نشد") }
              }

              private fun beginConnect() {
                  VnetVpnService.set("connecting")
                  val sid = sel
                  val pk = if (cfgs.none { it.first == pick }) "auto" else pick
                  Thread {
                      try {
                          val r = Api.callSync("core_links", JSONObject().put("service_id", sid).put("config_id", pk), true)
                          val arr = r.getJSONArray("links")
                          val links = ArrayList<String>()
                          for (i in 0 until arr.length()) links.add(arr.getString(i))
                          if (links.isEmpty()) throw ApiError("empty", "کانفیگی برای اتصال پیدا نشد")
                          val best = XrayConfig.pickBest(links)
                          val f = File(filesDir, "xray.json")
                          f.writeText(XrayConfig.build(best))
                          runOnUiThread {
                              val si = Intent(this, VnetVpnService::class.java).putExtra("cfg", f.absolutePath)
                              if (Build.VERSION.SDK_INT >= 26) startForegroundService(si) else startService(si)
                          }
                      } catch (e: Exception) {
                          VnetVpnService.lastError = e.message ?: "خطا در اتصال"
                          VnetVpnService.set("off")
                      }
                  }.start()
              }

              private fun onVpn() {
                  val cs = VnetVpnService.state
                  if (cs == "on" && lastVpn != "on") islandBanner(host, "✓ متصل شدید") else if (cs == "off" && lastVpn == "on") islandBanner(host, "اتصال قطع شد")
                  lastVpn = cs
                  power?.st = stateInt()
                  status?.text = if (VnetVpnService.state == "on") "متصل شدید" else if (VnetVpnService.state == "connecting") "در حال اتصال…" else "قطع"
                  if (VnetVpnService.state == "off" && VnetVpnService.lastError.isNotEmpty()) {
                      toast(VnetVpnService.lastError)
                      VnetVpnService.lastError = ""
                  }
              }

