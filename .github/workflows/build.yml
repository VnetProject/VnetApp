          package com.vnet.app

          import android.os.Handler
          import android.os.Looper
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.Executors

          class ApiError(val code: String, msg: String) : Exception(msg)

          object Api {
              var token: String = ""
              private val pool = Executors.newFixedThreadPool(4)
              private val main = Handler(Looper.getMainLooper())

              fun callSync(route: String, body: JSONObject = JSONObject(), native: Boolean = false): JSONObject {
                  var c: HttpURLConnection? = null
                  try {
                      c = URL(BuildConfig.API_URL + route).openConnection() as HttpURLConnection
                      c.requestMethod = "POST"
                      c.connectTimeout = 15000
                      c.readTimeout = 30000
                      c.doOutput = true
                      c.setRequestProperty("Content-Type", "application/json")
                      if (token.isNotEmpty()) c.setRequestProperty("X-Auth-Token", token)
                      if (native) c.setRequestProperty("X-Native-Key", BuildConfig.NATIVE_KEY)
                      c.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                      val code = c.responseCode
                      val stream = if (code >= 400) c.errorStream else c.inputStream
                      val txt = stream?.bufferedReader(Charsets.UTF_8)?.readText() ?: ""
                      val j = try { JSONObject(txt) } catch (e: Exception) { throw ApiError("bad", "پاسخ نامعتبر از سرور (کد " + code + ")") }
                      if (!j.optBoolean("ok")) throw ApiError(j.optString("error"), j.optString("message", "خطا"))
                      return j
                  } catch (e: ApiError) {
                      throw e
                  } catch (e: Exception) {
                      throw ApiError("net", "اتصال به سرور برقرار نشد (" + e.javaClass.simpleName + ": " + (e.message ?: "") + ")")
                  } finally {
                      c?.disconnect()
                  }
              }

              fun call(route: String, body: JSONObject, native: Boolean, ok: (JSONObject) -> Unit, err: (ApiError) -> Unit) {
                  pool.execute {
                      try {
                          val r = callSync(route, body, native)
                          main.post { ok(r) }
                      } catch (e: ApiError) {
                          main.post { err(e) }
                      }
                  }
              }
          }
