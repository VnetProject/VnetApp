                  back.setPadding(dp(12), 0, dp(14), dp(4))
                  bar.addView(back)
                  bar.addView(text(title, 18f, Theme.text, true))
                  page.addView(bar)
                  val col = column(16)
                  val sv = ScrollView(this)
                  sv.isVerticalScrollBarEnabled = false
                  sv.addView(col)
                  page.addView(sv, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  build(col)
                  var ox = host.width / 2f
                  var oy = dp(40).toFloat()
                  if (origin != null) {
                      val loc = IntArray(2)
                      origin.getLocationInWindow(loc)
                      ox = loc[0] + origin.width / 2f
                      oy = loc[1] + origin.height / 2f
                  }
                  val wrap = glassRoot(page, 2.4f)
                  wrap.isClickable = true
                  pages.add(Triple(wrap as View, ox, oy))
                  back.setOnClickListener { closePage() }
                  islandOpen(host, wrap, ox, oy)
              }

