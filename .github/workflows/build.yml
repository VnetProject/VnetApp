              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private var t = phase
              private var anim: ValueAnimator? = null
              private val cols = intArrayOf(Color.parseColor("#3D6FE8"), Color.parseColor("#8B3FE8"), Color.parseColor("#0FB9B1"), Color.parseColor("#E8743D"))
              private var shaders: Array<RadialGradient>? = null
              private var rad = 0f

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  rad = maxOf(w, h) * 0.55f
                  shaders = Array(4) { i -> RadialGradient(0f, 0f, rad, Color.argb(120, Color.red(cols[i]), Color.green(cols[i]), Color.blue(cols[i])), Color.TRANSPARENT, Shader.TileMode.CLAMP) }
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  val a = ValueAnimator.ofFloat(0f, (2 * Math.PI).toFloat())
                  a.duration = 30000
                  a.repeatCount = ValueAnimator.INFINITE
                  a.interpolator = LinearInterpolator()
                  a.addUpdateListener { t = (it.animatedValue as Float) + phase; invalidate() }
                  anim = a
                  a.start()
              }

              override fun onDetachedFromWindow() {
                  anim?.cancel()
                  anim = null
                  super.onDetachedFromWindow()
              }

              override fun onDraw(cv: Canvas) {
                  cv.drawColor(Color.parseColor("#06070D"))
                  val sh = shaders ?: return
                  val w = width.toFloat()
                  val h = height.toFloat()
                  for (i in 0..3) {
                      val cx = w * (0.5f + 0.42f * Math.cos((t * (1.0 + 0.12 * i) + i * 1.9)).toFloat())
                      val cy = h * (0.5f + 0.40f * Math.sin((t * (0.8 + 0.18 * i) + i * 2.4)).toFloat())
                      cv.save()
                      cv.translate(cx, cy)
                      p.shader = sh[i]
                      cv.drawCircle(0f, 0f, rad, p)
                      cv.restore()
                  }
                  p.shader = null
              }
          }

